[build]
  publish = "."
  command = "echo 'Sin compilación: sitio estático + funciones'"

# Versión de Node fija: las librerías de Cloudflare (R2) piden Node 20 o más.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# El panel y la zona privada no deben salir en Google
[[headers]]
  for = "/panel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/privado/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Política de seguridad: qué servicios puede usar la web. Si algún día se añade uno nuevo
# (otra plataforma de vídeo, un formulario externo, analítica…), hay que añadir su dirección aquí
# o no funcionará. Sin 'unsafe-inline' en script-src: no se ejecuta código suelto dentro del HTML
# (por eso js/arranque.js va aparte). Esto además evita el aviso «Powered by Netlify».
#   Firebase ............ www.gstatic.com, *.googleapis.com, apis.google.com, web-daniel-e9cf1.firebaseapp.com
#   Cloudinary .......... res.cloudinary.com (fotos y vídeos), api.cloudinary.com (subidas del panel)
#   Cloudflare R2 ....... *.r2.cloudflarestorage.com (vídeos privados: ver y subir)
#   YouTube / Vimeo ..... youtube-nocookie.com, youtube.com, player.vimeo.com, i.ytimg.com, i.vimeocdn.com
#   Google Fonts ........ fonts.googleapis.com, fonts.gstatic.com (letras elegidas en el panel)
#   Formspree ........... formspree.io (preparado para cuando se active)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://i.ytimg.com https://i.vimeocdn.com; media-src 'self' blob: https://res.cloudinary.com https://*.r2.cloudflarestorage.com; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://api.cloudinary.com https://*.r2.cloudflarestorage.com https://formspree.io; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com https://web-daniel-e9cf1.firebaseapp.com; form-action 'self' https://formspree.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
